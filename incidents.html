<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Incidents | Fire Station</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
      /* A little extra styling for the incident table. */

      .page-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filters input,
      .filters select {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        outline: none;
        font-size: 12px;
      }

      .filters input:focus,
      .filters select:focus {
        border-color: var(--red);
      }

      .table-wrap {
        overflow-x: auto;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
      }

      .data-table th {
        text-align: left;
        padding: 13px 18px;
        background: #fafafa;
        color: var(--muted);
        font-size: 11px;
        border-bottom: 1px solid var(--border);
      }

      .data-table td {
        padding: 15px 18px;
        border-bottom: 1px solid #f0f1f2;
        font-size: 12px;
        white-space: nowrap;
      }

      .data-table tr:hover {
        background: #fffafa;
      }

      .incident-id {
        color: var(--red);
        font-weight: 700;
      }

      .empty-state {
        text-align: center;
        padding: 45px 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .action-btn {
        border: 1px solid var(--border);
        background: white;
        padding: 6px 9px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
      }

      .action-btn:hover {
        border-color: var(--red);
        color: var(--red);
      }

      .detail-row {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid #f0f1f2;
        font-size: 12px;
      }

      .detail-row strong {
        color: var(--muted);
      }

      @media (max-width: 650px) {
        .page-actions {
          align-items: flex-start;
          flex-direction: column;
        }

        .filters {
          width: 100%;
        }

        .filters input,
        .filters select {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- JavaScript will build the complete incidents page here. -->
    <div id="app"></div>

    <script src="js/incidents.js"></script>
  </body>
</html>
